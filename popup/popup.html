<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>BetterChzzk</h1>

    <div class="setting-row">
      <label for="enabled">자동 배속</label>
      <input type="checkbox" id="enabled" />
    </div>

    <div class="setting-row">
      <label for="threshold">시작 지연시간</label>
      <div class="input-group">
        <input type="number" id="threshold" step="0.5" min="1" max="30" />
        <span class="unit">초</span>
      </div>
    </div>

    <div class="setting-row">
      <label for="rate">재생 속도</label>
      <div class="input-group">
        <input type="number" id="rate" step="0.05" min="1.05" max="2" />
        <span class="unit">배</span>
      </div>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
